name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ./Project.sln

      - name: Build
        run: dotnet build ./Project.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ./Project.sln --configuration Release --no-build --verbosity normal